name: Java CI/CD Pipeline

on:
 workflow_dispatch:
  # push:
   # branches:
    #  - main  # Trigger the pipeline when pushing to the main branch
  # pull_request:
   # branches:
    #  - main  # Trigger the pipeline for pull requests to the main branch

jobs:
  Build:
    runs-on: ubuntu-latest  # GitHub-hosted runner (Ubuntu is used, but you can choose other OS like macOS or Windows)

    steps:
    # Step 1: Checkout the code from GitHub repository
    - name: Checkout repository
      uses: actions/checkout@v4.2.2

    # Step 2: Set up JDK 11 (or any version you need)
    - name: Set up JDK
      uses: actions/setup-java@v4.6.0
      with:
        java-version: '17'
        distribution: 'microsoft'

    # Step 3: Build the Java application with Maven (you can replace this with Gradle if needed)
    - name: Build with Maven
      run: mvn clean install -DskipTests
   
    # Step 4: Package the application (skip tests during packaging)
    - name: Package the application (skip tests)
      run: mvn package -DskipTests
      
    
    # Step 5: Build the Docker image
    # - name: Build Docker image
      # run: |
      #  docker build -t hassan1049/myapp:v1 .
    
    # Step 6: Log in to Docker Hub (using GitHub Secrets)
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Step 7: Push the Docker image to Docker Hub
    # - name: Push Docker image to Docker Hub
     # run: |
      #  docker push hassan1049/myapp:v1
  
   
    # Step 8: Set up kubectl for Kubernetes deployment
    - name: Set up kubectl
      uses: medyagh/setup-minikube@master

    - name: Try the cluster !
      run: kubectl get pods -A
      
    - name: Build image
      run: |
          export SHELL=/bin/bash
          eval $(minikube -p minikube docker-env)
          docker build -t hassan1049/myapp:v2 .
          docker push hassan1049/myapp:v2
          echo -n "verifying images:"
          docker images      
    - name: Deploy to minikube
      run: |
         kubectl apply -f deployment.yaml
         kubectl apply -f service.yaml
    - name: Try the cluster !
      run: |
       kubectl get pods -A
       kubectl get pods
       kubectl describe pods
       kubectl get deployments
       
      
    # - name: Test service URLs
     # run: |
      # minikube service list
       # minikube service myapp-service --url
